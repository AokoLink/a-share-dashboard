<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股三层分析看板</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/echarts.min.js"></script>
</head>
<body>
<header id="topbar">
  <div class="brand">📈 A股三层分析看板</div>
  <div class="top-actions">
    <span id="updated" class="muted">—</span>
    <button id="btn-refresh" title="手动刷新">🔄 刷新</button>
    <label class="switch"><input type="checkbox" id="auto-refresh"><span>自动刷新(60s)</span></label>
    <span id="stale-flag" class="hidden">⚠️ 数据可能过期</span>
  </div>
</header>

<section id="regime-bar" class="panel hidden">
  <div id="regime-indicator"></div>
</section>

<section id="market-bar" class="panel">
  <div id="indices" class="indices"></div>
  <div id="breadth" class="breadth"></div>
</section>

<main id="layout">
  <section id="left" class="panel">
    <div class="tabs">
      <button class="tab active" data-type="industry" data-view="sectors">行业板块</button>
      <button class="tab" data-view="recommend">推荐</button>
      <button class="tab" data-view="themevol">主题策略</button>
      <button class="tab" data-view="actionable">可介入龙头</button>
      <button class="tab" data-view="swing">波段</button>
      <button class="tab" data-view="diagnose">持仓诊断</button>
      <button class="tab" data-view="tradesim">交易回测</button>
    </div>
    <div id="sector-view">
      <div class="sector-tools">
        <input id="sector-search" placeholder="板块搜索,如 半导">
        <button id="btn-sector-search">搜索</button>
      </div>
      <table id="sector-table">
        <thead><tr><th>板块</th><th>涨幅%</th><th>情绪</th><th>强度</th><th>风险</th><th>综合</th><th>结论</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="reco-panel" class="hidden">
      <div id="reco-regime" class="muted"></div>
      <div id="reco-disclaimer" class="muted">仅供研究参考,不构成投资建议。</div>
      <div id="reco-exec" class="muted"></div>
      <div id="reco-coverage" class="muted"></div>
      <div id="reco-sectors"></div>
      <div id="reco-skipped" class="muted"></div>
    </div>
    <div id="actionable-panel" class="hidden">
      <div id="actionable-meta" class="muted"></div>
      <table class="actionable-table">
        <thead><tr><th>板块</th><th>板块评价</th><th>名称</th><th>代码</th><th>现价</th><th>涨跌幅</th><th>位置</th><th>标签</th><th>档位</th><th>综合分</th><th>风险</th><th>乖离率%</th></tr></thead>
        <tbody id="actionable-table"></tbody>
      </table>
      <div id="actionable-skipped" class="muted"></div>
    </div>
    <div id="swing-panel" class="hidden">
      <div id="swing-meta" class="muted"></div>
      <div id="swing-guidance"></div>
      <div id="swing-tools">
        <button id="btn-swing-switch">切换股票</button>
        <span id="swing-edit-mode" class="hidden">
          <input id="swing-add-input" placeholder="输入 6 位代码加入自选">
          <button id="btn-swing-add">加入</button>
        </span>
      </div>
      <div id="swing-stocks"></div>
      <div class="muted">点击自选名称 → 右侧查看该股 K 线与三层评分。</div>
      <div id="swing-candidates"></div>
    </div>
    <div id="themevol-panel" class="hidden">
      <div id="themevol-meta" class="muted"></div>
      <div id="themevol-summary"></div>
      <div id="themevol-positions"></div>
    </div>
    <div id="diagnose-panel" class="hidden">
      <div id="diagnose-meta" class="muted"></div>
      <div id="diagnose-tools">
        <input id="diagnose-input" placeholder="输入 6 位代码,如 600519">
        <button id="btn-diagnose">诊断</button>
        <button id="btn-diagnose-wl">诊断自选</button>
      </div>
      <div class="muted">持仓诊断给出 1/3/5/10/20 日 P(涨) 与期望收益,并标注是否超过成本;测不到会明说「信号不足,无法判断」。不构成买卖建议。</div>
      <div id="diagnose-results"></div>
    </div>
    <div id="tradesim-panel" class="hidden">
      <div id="tradesim-meta" class="muted"></div>
      <table class="actionable-table">
        <thead><tr><th>篮子</th><th>笔数</th><th>胜率</th><th>盈亏比</th><th>期望</th><th>最大回撤</th><th>平均盈利</th><th>平均亏损</th><th>平均最高</th><th>平均回撤</th></tr></thead>
        <tbody id="tradesim-table"></tbody>
      </table>
    </div>
  </section>

  <section id="right" class="panel">
    <div class="stock-tools">
      <input id="stock-search" placeholder="股票代码,如 600519 或 sh600519">
      <button id="btn-stock">查询</button>
    </div>
    <div id="detail">
      <div id="detail-title" class="muted">点击左侧板块行,或输入股票代码查看个股</div>
      <div id="chart-sector" class="chart hidden"></div>
      <div id="sector-scores" class="score-cards hidden"></div>
      <div id="sector-leaders" class="hidden"></div>
      <div id="chart-stock" class="chart hidden"></div>
      <div id="chart-intraday" class="chart hidden"></div>
      <div id="stock-scores" class="score-cards hidden"></div>
      <div id="hold-advice" class="hidden"></div>
      <div id="volume-price" class="hidden"></div>
      <div id="tech-indicators" class="hidden"></div>
    </div>
  </section>
</main>

<footer id="watchlist">
  <span class="wl-label">⭐ 自选:</span>
  <span id="wl-items"></span>
  <button id="btn-wl-add" class="hidden">加入自选</button>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
